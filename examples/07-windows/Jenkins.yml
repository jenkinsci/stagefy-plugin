# yaml-language-server: $schema=https://raw.githubusercontent.com/jenkinsci/stagefy-plugin/main/schema/stagefy.schema.json

build:
  steps:
    # ${env.VAR} becomes %VAR% in bat and $env:VAR in powershell/pwsh.
    - bat: "echo Build %BUILD_NUMBER% on Windows"
    - bat: "echo Build ${env.BUILD_NUMBER}"
    - powershell: "Write-Host 'Build ${env.BUILD_NUMBER} (Windows PowerShell)'"
    - pwsh: "Write-Host 'Build ${env.BUILD_NUMBER} (PowerShell 7)'"
