# yaml-language-server: $schema=https://raw.githubusercontent.com/jenkinsci/stagefy-plugin/main/schema/stagefy.schema.json

ci:
  stages:
    - configure
    - build
    - deploy

# Exports the `env:` map of the YAML file into the build environment.
configure:
  steps:
    - setEnvFromFile: examples/06-conditional/settings.yml

build:
  steps:
    - sh: "echo building for ${env.TARGET_ENV}"

# `when` is a Groovy expression; the stage is skipped when it is false.
# It runs outside the Script Security sandbox, so only use trusted YAML.
deploy:
  when: "params.DEPLOY && env.BRANCH_NAME == 'main'"
  steps:
    - sh: "echo deploying to ${env.TARGET_ENV}"
