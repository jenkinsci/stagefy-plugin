# yaml-language-server: $schema=https://raw.githubusercontent.com/jenkinsci/stagefy-plugin/main/schema/stagefy.schema.json

smoke:
  template:
    arguments: [target]
  steps:
    - sh: "echo smoke test '{target}'"

deploy:
  template:
    arguments: [target, replicas]
  steps:
    - sh: "echo deploy to '{target}' with {replicas} replicas"

release:
  stages:
    # List of scalars -> stages smoke_dev, smoke_staging.
    - iterated:
        template: smoke
        over: [dev, staging]
    # List of maps -> each key is an argument; `_name` names the generated stage.
    - iterated:
        template: deploy
        over:
          - { _name: small, target: dev, replicas: 1 }
          - { _name: large, target: prod, replicas: 5 }
    # Comma-separated environment variable -> smoke_seoul, smoke_tokyo.
    - iterated:
        template: smoke
        over: env.REGIONS
