# yaml-language-server: $schema=https://raw.githubusercontent.com/jenkinsci/stagefy-plugin/main/schema/stagefy.schema.json

# `stages` runs the referenced stages one after another.
all:
  stages:
    - build
    - test

# `parallels` runs the referenced stages at the same time.
test:
  parallels:
    - unit
    - lint

build:
  steps:
    - sh: "echo building"

unit:
  steps:
    - sh: "echo running unit tests"

lint:
  steps:
    - sh: "echo running lint"
