# yaml-language-server: $schema=https://raw.githubusercontent.com/jenkinsci/stagefy-plugin/main/schema/stagefy.schema.json

# A template declares its arguments and may contain plain steps only.
# It cannot be run directly. Reference arguments as {name}.
# Quote arguments in `sh` steps: they are inlined as text.
deploy:
  template:
    arguments: [target, version]
  steps:
    - sh: "echo deploying '{version}' to '{target}'"

# Sibling keys of `template:` supply the arguments.
release:
  stages:
    - template: deploy
      target: staging
      version: 1.2.0
    - template: deploy
      target: production
      version: 1.2.0
